name: Update resale data

on:
  schedule:
    - cron: "47 11 * * *"   # 6:47 AM Eastern (standard time), every day
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull eBay + Google Trends data
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "$SERPAPI_KEY" ]; then
            echo "::error::Add your SerpApi key as a repository secret named SERPAPI_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          python3 tracker.py data.json

      - name: Commit the new data
        run: |
          git config user.name "bucket-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update resale data $(date -u +%Y-%m-%d)"
            git push
          fi
